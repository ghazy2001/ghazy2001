<svg width="850" height="30" viewBox="0 0 850 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base track gradient fading softly at ends -->
    <linearGradient id="trackGrad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9e5246" stop-opacity="0" />
      <stop offset="15%" stop-color="#9e5246" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#daab7e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffe4c4" stop-opacity="1" />
      <stop offset="65%" stop-color="#daab7e" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#9e5246" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9e5246" stop-opacity="0" />
    </linearGradient>

    <!-- Right-facing pulse (head pointing right) -->
    <linearGradient id="pulseRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e5246" stop-opacity="0" />
      <stop offset="35%" stop-color="#daab7e" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#ffe4c4" stop-opacity="0.95" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffe4c4" stop-opacity="0" />
    </linearGradient>

    <!-- Left-facing pulse (head pointing left) -->
    <linearGradient id="pulseLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe4c4" stop-opacity="0" />
      <stop offset="10%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#ffe4c4" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#daab7e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9e5246" stop-opacity="0" />
    </linearGradient>

    <!-- Right ambient glow -->
    <linearGradient id="ambientRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daab7e" stop-opacity="0" />
      <stop offset="80%" stop-color="#ffe4c4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#daab7e" stop-opacity="0" />
    </linearGradient>

    <!-- Left ambient glow -->
    <linearGradient id="ambientLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daab7e" stop-opacity="0" />
      <stop offset="20%" stop-color="#ffe4c4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#daab7e" stop-opacity="0" />
    </linearGradient>

    <!-- Center diamond core radial glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffe4c4" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#daab7e" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#daab7e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Background Track -->
  <rect x="30" y="13.5" width="790" height="3" rx="1.5" fill="url(#trackGrad)" opacity="0.35" />

  <!-- Sharp Core Track -->
  <rect x="30" y="14" width="790" height="2" rx="1" fill="url(#trackGrad)" />

  <!-- ==================== BIDIRECTIONAL TRAVELING PULSES ==================== -->
  
  <!-- Right Pulse (Starts at center 410, travels to 760) -->
  <g>
    <rect x="400" y="12" width="110" height="6" rx="3" fill="url(#ambientRight)">
      <animate attributeName="x" values="400;750" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.12;0.7;0.92;1" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="410" y="13" width="90" height="4" rx="2" fill="url(#pulseRight)">
      <animate attributeName="x" values="410;760" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0.9;0;0" keyTimes="0;0.12;0.7;0.92;1" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Left Pulse (Starts at center 350, travels to 0) -->
  <g>
    <rect x="340" y="12" width="110" height="6" rx="3" fill="url(#ambientLeft)">
      <animate attributeName="x" values="340;-10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.7;0.7;0;0" keyTimes="0;0.12;0.7;0.92;1" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="350" y="13" width="90" height="4" rx="2" fill="url(#pulseLeft)">
      <animate attributeName="x" values="350;0" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0.9;0;0" keyTimes="0;0.12;0.7;0.92;1" dur="3s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ==================== CENTER DIAMOND & SATELLITES ==================== -->
  <circle cx="425" cy="15" r="11" fill="url(#coreGlow)">
    <animate attributeName="r" values="8;14;8;8" keyTimes="0;0.2;0.6;1" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.5;0.4" keyTimes="0;0.2;0.6;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <rect x="421" y="11" width="8" height="8" rx="1.5" transform="rotate(45 425 15)" fill="#ffe4c4" stroke="#9e5246" stroke-width="1.5" />
  <circle cx="425" cy="15" r="1.8" fill="#24141e" />

  <!-- Satellite Accents -->
  <circle cx="390" cy="15" r="2.5" fill="#daab7e" opacity="0.9" />
  <circle cx="460" cy="15" r="2.5" fill="#daab7e" opacity="0.9" />
  <circle cx="360" cy="15" r="1.8" fill="#9e5246" opacity="0.8" />
  <circle cx="490" cy="15" r="1.8" fill="#9e5246" opacity="0.8" />
  <circle cx="330" cy="15" r="1.2" fill="#9e5246" opacity="0.6" />
  <circle cx="520" cy="15" r="1.2" fill="#9e5246" opacity="0.6" />
</svg>